[package]
name = "aidex-context"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Offline repository index, search, project rules, memory, and budgeted context packs for AiDEX."

[dependencies]
aidex-core = { path = "../core" }
aidex-drive = { path = "../drive" }
aidex-events = { path = "../events" }
aidex-policy = { path = "../policy" }
aidex-workspace = { path = "../workspace" }
ignore = "0.4"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

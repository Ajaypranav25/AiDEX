[package]
name = "aidex-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aidex-core = { path = "../core" }
aidex-drive = { path = "../drive" }
aidex-events = { path = "../events" }
aidex-host = { path = "../host" }
aidexd = { path = "../aidexd" }
clap.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[[bin]]
name = "aidex"
path = "src/main.rs"

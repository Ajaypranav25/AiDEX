[package]
name = "aidex-sandbox"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Fail-closed OS process isolation backends for AiDEX managed processes."

[lib]
path = "src/lib.rs"

[[bin]]
name = "aidex-sandbox-exec"
path = "src/bin/aidex-sandbox-exec.rs"

[dependencies]
aidex-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
sysinfo = { version = "0.36", default-features = false, features = ["system"] }
win32job = "2.0.3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["process", "resource", "sched", "signal", "user"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"

[dev-dependencies]
serde_json = "1"
sysinfo = { version = "0.36", default-features = false, features = ["system"] }
tempfile = "3"

[lints]
workspace = true

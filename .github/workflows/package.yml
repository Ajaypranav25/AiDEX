name: Package

on:
  push:
    branches: [main]
  # Pull requests that change packaging inputs prove the bundles before they merge.
  pull_request:
    paths:
      - "crates/bundle/**"
      - "crates/launcher/**"
      - "crates/packager/**"
      - "crates/updater/**"
      - "portable/packaging/**"
      - ".github/workflows/package.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  bundle:
    name: Bundle (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            triple: x86_64-pc-windows-msvc
            archive: zip
          - os: ubuntu-latest
            target: linux-x64
            triple: x86_64-unknown-linux-musl
            archive: tar.gz
          - os: macos-latest
            target: macos-arm64
            triple: aarch64-apple-darwin
            archive: tar.gz
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      # The bundled SQLite is C code; musl targets need a musl C toolchain.
      - name: Install musl tools
        if: matrix.target == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: package-${{ matrix.target }}

      # An ephemeral key, generated in this job and gone with its runner: it proves the
      # signing and verification path, nothing more. It is not a release key and its
      # secret half is never uploaded. Releases are signed with the protected release key
      # (portable/packaging/README.md#signing-keys); no signing secret is used here.
      - name: Generate an ephemeral CI signing key
        run: cargo run --locked -p aidex-packager -- keygen --name ci-ephemeral --out "$RUNNER_TEMP/aidex-keys"

      # The CI key is baked into these binaries (AIDEX_BUILD_TRUSTED_KEYS) so the launcher
      # and CLI accept the bundle this job signs. Release builds trust release keys only.
      - name: Build bundle
        run: |
          cargo run --locked -p aidex-packager -- build --target ${{ matrix.target }} --out dist \
            --trust-key "$RUNNER_TEMP/aidex-keys/ci-ephemeral.pub.json"

      - name: Sign bundle
        run: |
          cargo run --locked -p aidex-packager -- sign \
            --key "$RUNNER_TEMP/aidex-keys/ci-ephemeral.key" \
            dist/aidex-*-${{ matrix.target }}.${{ matrix.archive }}
          cp "$RUNNER_TEMP/aidex-keys/ci-ephemeral.pub.json" dist/

      - name: Verify signature, checksums, and SBOM
        run: |
          cargo run --locked -p aidex-packager -- --json verify \
            --trust-key dist/ci-ephemeral.pub.json \
            dist/aidex-*-${{ matrix.target }}.${{ matrix.archive }} > dist/verify-${{ matrix.target }}.json
          cat dist/verify-${{ matrix.target }}.json

      # Installs the signed archive into a fresh developer drive under the runner temp
      # directory, runs AiDEX.exe / ./aidex (--launcher-verify, --version, doctor --json,
      # update verify, daemon start/status/stop) and requires the bundled CLI to report
      # the same signer and a valid SBOM; fails on new entries in the user's home,
      # config, data, and cache directories or on unexpected names at the drive root.
      - name: Smoke-test bundle
        run: |
          cargo run --locked -p aidex-packager -- --json smoke \
            --archive dist/aidex-*-${{ matrix.target }}.${{ matrix.archive }} \
            --trust-key dist/ci-ephemeral.pub.json \
            --work "$RUNNER_TEMP/aidex-smoke" > dist/smoke-${{ matrix.target }}.json
          cat dist/smoke-${{ matrix.target }}.json

      - uses: actions/upload-artifact@v4
        with:
          name: aidex-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.cdx.json
            dist/SHA256SUMS
            dist/ci-ephemeral.pub.json
            dist/verify-${{ matrix.target }}.json
            dist/smoke-${{ matrix.target }}.json
          if-no-files-found: error

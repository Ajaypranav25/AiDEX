[workspace]
resolver = "2"
members = [
    "crates/aidexd",
    "crates/aidex-cli",
    "crates/core",
    "crates/drive",
    "crates/events",
    "crates/host",
    "crates/inference",
    "crates/policy",
    "crates/providers",
    "crates/router",
    "crates/sandbox",
    "crates/sessions",
    "crates/storage",
    "crates/vault",
    "crates/workspace",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }

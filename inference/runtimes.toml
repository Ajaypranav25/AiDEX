# Pinned llama.cpp runtime bundles AiDEX can install (spec §10.2, §67).
#
# Every entry is an upstream release archive from github.com/ggml-org/llama.cpp,
# identified by its exact size and SHA-256 (taken from the GitHub release asset
# digests). `aidex runtime install <ARCHIVE>` accepts only archives listed here.
# `tree_sha256` pins the extracted file set (sha256sum lines of every file,
# sorted by path) when AiDEX has measured it; launches then refuse any runtime
# whose files differ. `validated = true` means AiDEX's real-model test passed
# with that archive; everything else is listed but not validated.
#
# Licence: llama.cpp is MIT licensed (https://github.com/ggml-org/llama.cpp/blob/master/LICENSE).
# The Windows CPU archive also ships libomp.dll with LICENSE-LLVM-OpenMP (Apache-2.0 WITH LLVM-exception).
